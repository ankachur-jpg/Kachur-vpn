name: Build Kachur VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout official AmneziaWG Android sources
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-android
          ref: 5c16489e2cd9ed3a0a7a27c7445bba5238132f86
          submodules: recursive
          path: .upstream-awg
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;34.0.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Build pinned AmneziaWG Android engine
        run: bash third_party/amneziawg/build.sh .upstream-awg

      - name: Test keepalive interoperability with AWG 2.0
        run: |
          test_dir=$(mktemp -d "$RUNNER_TEMP/check-awg-XXXXXX")
          cp .upstream-awg/tunnel/tools/libwg-go/{go.mod,go.sum} third_party/amneziawg/tests/keepalive_test.go "$test_dir/"
          cd "$test_dir"
          go mod edit -require=github.com/amnezia-vpn/amneziawg-go@v0.2.18
          GOTOOLCHAIN=local go test -mod=mod -timeout=45s .

      - name: Test and build debug and unsigned release APKs
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace

      - name: Verify AmneziaWG binaries and licenses in APK
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            for abi in arm64-v8a armeabi-v7a x86_64 x86; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libwg-go.so"
            done
            unzip -Z1 "$apk" | grep -Fx "assets/amneziawg-licenses/amneziawg-android.txt"
            unzip -Z1 "$apk" | grep -Fx "assets/amneziawg-licenses/github.com_amnezia-vpn_amneziawg-go_v3-LICENSE.txt"
          done

      - name: Verify the release build uses no signing credentials
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          if "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "Release verification expects the unsigned Gradle output" >&2
            exit 1
          fi
          "$tools/aapt2" dump badging "$apk" | sed -n '/^package:/p'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kachur-VPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Select available Android emulator image
        id: ui-image
        run: |
          find_android_17() {
            sdkmanager --list --channel="$1" |
              sed -nE 's/^[[:space:]]*system-images;android-(37(\.0)?|CinnamonBun);google_apis;x86_64[[:space:]]*\|.*/\1/p' |
              head -n 1
          }
          channel=stable
          image=$(find_android_17 0)
          if [ -z "$image" ]; then
            image=$(find_android_17 3)
            if [ -n "$image" ]; then
              channel=canary
            else
              image=36
            fi
          fi
          echo "Using system image android-$image ($channel)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Test Views and capture Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: ${{ steps.ui-image.outputs.image }}
          channel: ${{ steps.ui-image.outputs.channel }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash .github/scripts/capture-ui.sh

      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Kachur-VPN-UI-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: error

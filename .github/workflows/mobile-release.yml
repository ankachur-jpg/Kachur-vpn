name: Build standalone Android phone release

on:
  workflow_dispatch:
  push:
    branches: [release/mobile-1.0.1]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout official AmneziaWG Android sources
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-android
          ref: 5c16489e2cd9ed3a0a7a27c7445bba5238132f86
          submodules: recursive
          path: .upstream-awg
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;34.0.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Build pinned AmneziaWG Android engine
        run: bash third_party/amneziawg/build.sh .upstream-awg

      - name: Build the unsigned mobile release and the existing phone app
        run: gradle assembleMobileRelease assembleDebug --stacktrace

      - name: Align and verify production package
        run: |
          set -eu
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=Kachur-VPN-Mobile-1.0.1-unsigned.apk
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/mobileRelease/*-unsigned.apk "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/mobile-badging"
          grep -F "package: name='com.kachur.vpn.mobile' versionCode='10001' versionName='1.0.1'" "$RUNNER_TEMP/mobile-badging"
          grep -F "application-label:'Kachur VPN Mobile'" "$RUNNER_TEMP/mobile-badging"
          if grep -Fxq application-debuggable "$RUNNER_TEMP/mobile-badging"; then exit 1; fi
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do unzip -Z1 "$apk" | grep -Fx "lib/$abi/libwg-go.so"; done
          cp "$tools/lib/apksigner.jar" apksigner.jar
          "$tools/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out "$RUNNER_TEMP/mobile-install-check.apk" "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kachur-VPN-Mobile-unsigned
          path: |
            Kachur-VPN-Mobile-1.0.1-unsigned.apk
            apksigner.jar
          if-no-files-found: error

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install both packages and launch the mobile release on a phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install "$RUNNER_TEMP/mobile-install-check.apk"
            adb shell pm path com.kachur.vpn | grep -F base.apk
            adb shell pm path com.kachur.vpn.mobile | grep -F base.apk
            adb shell am start -W -n com.kachur.vpn.mobile/com.kachur.vpn.MainActivity | grep -F 'Status: ok'
            sleep 2
            adb shell pidof com.kachur.vpn.mobile
